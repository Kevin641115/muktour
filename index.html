<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전국 맛집 지도 대장</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f5f5f7; color: #333; padding: 16px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: #1d1d1f; }
    
    .card { background: #ffffff; border-radius: 12px; padding: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; color: #2c3e50; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #666; }
    select, input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; outline: none; }
    select:focus, input:focus, textarea:focus { border-color: #007aff; }
    
    .select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    button.btn-submit { width: 100%; padding: 12px; background-color: #007aff; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 8px; }
    button.btn-submit:active { background-color: #0056b3; }
    
    .restaurant-item { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: flex-start; }
    .restaurant-info { flex: 1; padding-right: 10px; }
    .restaurant-name { font-size: 1.1rem; font-weight: bold; color: #1d1d1f; margin-bottom: 4px; }
    .badge { display: inline-block; background-color: #eef2ff; color: #4f46e5; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
    .details { font-size: 0.85rem; color: #555; line-height: 1.4; }
    
    .btn-delete { background-color: #ff3b30; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; flex-shrink: 0; }
    .btn-delete:active { background-color: #c02b25; }
    .empty-msg { text-align: center; color: #888; font-size: 0.9rem; padding: 20px 0; }
  </style>
</head>
<body>

  <h1>📍 전국 맛집 지도 대장</h1>

  <!-- 1. 지역 선택 & 등록 폼 -->
  <div class="card">
    <div class="card-title">1. 지역 및 맛집 정보 입력</div>
    
    <div class="form-group select-grid">
      <div>
        <label>시/도</label>
        <select id="sidoSelect" onchange="updateSigungu()">
          <option value="">시/도 선택</option>
        </select>
      </div>
      <div>
        <label>시/군/구 (기초지자체)</label>
        <select id="sigunguSelect">
          <option value="">시/군/구 선택</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>상호명 *</label>
      <input type="text" id="nameInput" placeholder="예: 소문난 식당">
    </div>

    <div class="form-group">
      <label>대표 메뉴</label>
      <input type="text" id="menuInput" placeholder="예: 김치찌개, 불고기">
    </div>

    <div class="form-group">
      <label>연락처</label>
      <input type="tel" id="phoneInput" placeholder="02-123-4567">
    </div>

    <div class="form-group">
      <label>기타 사항</label>
      <textarea id="noteInput" rows="2" placeholder="주차 가능, 주말 대기 있음 등"></textarea>
    </div>

    <button class="btn-submit" onclick="addRestaurant()">맛집 등록하기</button>
  </div>

  <!-- 2. 필터 및 맛집 리스트 -->
  <div class="card-title" style="padding: 0 4px; margin-bottom: 8px;">2. 등록된 맛집 목록 (가나다순)</div>
  <div class="form-group" style="margin-bottom: 12px;">
    <select id="filterSido" onchange="renderList()">
      <option value="">전체 지역 보기</option>
    </select>
  </div>

  <div id="restaurantList"></div>

  <script>
    // 대한민국 17개 광역자치단체 전체 데이터
    const areaData = {
      "서울특별시": ["강남구", "강동구", "강북구", "강서구", "관악구", "광진구", "구로구", "금천구", "노원구", "도봉구", "동대문구", "동작구", "마포구", "서대문구", "서초구", "성동구", "성북구", "송파구", "양천구", "영등포구", "용산구", "은평구", "종로구", "중구", "중랑구"],
      "부산광역시": ["강서구", "금정구", "남구", "동구", "동래구", "부산진구", "북구", "사상구", "사하구", "서구", "수영구", "연제구", "영도구", "중구", "해운대구", "기장군"],
      "대구광역시": ["중구", "동구", "서구", "남구", "북구", "수성구", "달서구", "달성군", "군위군"],
      "인천광역시": ["중구", "동구", "미추홀구", "연수구", "남동구", "부평구", "계양구", "서구", "강화군", "옹진군"],
      "광주광역시": ["동구", "서구", "남구", "북구", "광산구"],
      "대전광역시": ["동구", "중구", "서구", "유성구", "대덕구"],
      "울산광역시": ["중구", "남구", "동구", "북구", "울주군"],
      "세종특별자치시": ["세종시"],
      "경기도": ["수원시", "성남시", "고양시", "용인시", "부천시", "안산시", "안양시", "남양주시", "화성시", "평택시", "의정부시", "파주시", "시흥시", "김포시", "광명시", "광주시", "군포시", "이천시", "오산시", "하남시", "양주시", "구리시", "안성시", "포천시", "의왕시", "여주시", "양평군", "동두천시", "가평군", "과천시", "연천군"],
      "강원특별자치도": ["춘천시", "원주시", "강릉시", "동해시", "태백시", "속초시", "삼척시", "홍천군", "횡성군", "영월군", "평창군", "정선군", "철원군", "화천군", "양구군", "인제군", "고성군", "양양군"],
      "충청북도": ["청주시", "충주시", "제천시", "보은군", "옥천군", "영동군", "증평군", "진천군", "괴산군", "음성군", "단양군"],
      "충청남도": ["천안시", "공주시", "보령시", "아산시", "서산시", "논산시", "계룡시", "당진시", "금산군", "부여군", "서천군", "청양군", "홍성군", "예산군", "태안군"],
      "전북특별자치도": ["전주시", "군산시", "익산시", "정읍시", "남원시", "김제시", "완주군", "진안군", "무주군", "장수군", "임실군", "순창군", "고창군", "부안군"],
      "전라남도": ["목포시", "여수시", "순천시", "나주시", "광양시", "담양군", "곡성군", "구례군", "고흥군", "보성군", "화순군", "장흥군", "강진군", "해남군", "영암군", "무안군", "함평군", "영광군", "장성군", "완도군", "진도군", "신안군"],
      "경상북도": ["포항시", "경주시", "김천시", "안동시", "구미시", "영주시", "영천시", "상주시", "문경시", "경산시", "의성군", "청송군", "영양군", "영덕군", "청도군", "고령군", "성주군", "칠곡군", "예천군", "봉화군", "울진군", "울릉군"],
      "경상남도": ["창원시", "진주시", "통영시", "사천시", "김해시", "밀양시", "거제시", "양산시", "의령군", "함안군", "창녕군", "고성군", "남해군", "하동군", "산청군", "함양군", "거창군", "합천군"],
      "제주특별자치도": ["제주시", "서귀포시"]
    };

    let restaurants = JSON.parse(localStorage.getItem('myRestaurants')) || [];

    // 페이지 로드 시 시/도 드롭다운 초기화
    window.onload = function() {
      const sidoSelect = document.getElementById('sidoSelect');
      const filterSido = document.getElementById('filterSido');
      
      for (let sido in areaData) {
        sidoSelect.innerHTML += `<option value="${sido}">${sido}</option>`;
        filterSido.innerHTML += `<option value="${sido}">${sido}</option>`;
      }
      renderList();
    };

    // 시/도 선택 시 기초지자체(시/군/구) 업데이트
    function updateSigungu() {
      const sido = document.getElementById('sidoSelect').value;
      const sigunguSelect = document.getElementById('sigunguSelect');
      sigunguSelect.innerHTML = '<option value="">시/군/구 선택</option>';

      if (sido && areaData[sido]) {
        areaData[sido].forEach(sigungu => {
          sigunguSelect.innerHTML += `<option value="${sigungu}">${sigungu}</option>`;
        });
      }
    }

    // 맛집 등록
    function addRestaurant() {
      const sido = document.getElementById('sidoSelect').value;
      const sigungu = document.getElementById('sigunguSelect').value;
      const name = document.getElementById('nameInput').value.trim();
      const menu = document.getElementById('menuInput').value.trim();
      const phone = document.getElementById('phoneInput').value.trim();
      const note = document.getElementById('noteInput').value.trim();

      if (!sido || !sigungu) {
        alert("기초지자체(시/도 및 시/군/구)를 선택해 주세요.");
        return;
      }
      if (!name) {
        alert("상호명을 입력해 주세요.");
        return;
      }

      const newEntry = {
        id: Date.now(),
        sido,
        sigungu,
        name,
        menu,
        phone,
        note
      };

      restaurants.push(newEntry);
      saveAndRender();

      // 입력 폼 초기화
      document.getElementById('nameInput').value = '';
      document.getElementById('menuInput').value = '';
      document.getElementById('phoneInput').value = '';
      document.getElementById('noteInput').value = '';
    }

    // 삭제 기능
    function deleteRestaurant(id) {
      if (confirm("이 맛집을 삭제하시겠습니까?")) {
        restaurants = restaurants.filter(item => item.id !== id);
        saveAndRender();
      }
    }

    // 저장 및 목록 출력 (가나다순 정렬 포함)
    function saveAndRender() {
      // 상호명 기준 가나다순(오름차순) 정렬
      restaurants.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
      localStorage.setItem('myRestaurants', JSON.stringify(restaurants));
      renderList();
    }

    // 목록 화면에 렌더링
    function renderList() {
      const listContainer = document.getElementById('restaurantList');
      const filterSido = document.getElementById('filterSido').value;
      listContainer.innerHTML = '';

      const filteredList = filterSido 
        ? restaurants.filter(r => r.sido === filterSido)
        : restaurants;

      if (filteredList.length === 0) {
        listContainer.innerHTML = '<div class="empty-msg">등록된 맛집이 없습니다.</div>';
        return;
      }

      filteredList.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'restaurant-item';
        itemEl.innerHTML = `
          <div class="restaurant-info">
            <span class="badge">${item.sido} ${item.sigungu}</span>
            <div class="restaurant-name">${item.name}</div>
            <div class="details">
              ${item.menu ? `<div><b>대표메뉴:</b> ${item.menu}</div>` : ''}
              ${item.phone ? `<div><b>연락처:</b> ${item.phone}</div>` : ''}
              ${item.note ? `<div><b>기타:</b> ${item.note}</div>` : ''}
            </div>
          </div>
          <button class="btn-delete" onclick="deleteRestaurant(${item.id})">삭제</button>
        `;
        listContainer.appendChild(itemEl);
      });
    }
  </script>
</body>
</html>
